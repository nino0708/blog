name: サイトのビルド確認

# PR ごとに本番と同じビルドとリンク検査を走らせ、公開前に壊れに気づけるようにする。
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: ビルド
        run: npm run build
        env:
          SITE_URL: https://builtjapan.com
      - name: 内部リンク検査
        run: npm run check:links
